<div class="app" id="app-root">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/static/icons/icon.svg" alt="" width="28" height="28">
      <span>JSCalendar</span>
    </div>
    <a class="btn btn-primary btn-block new-event-btn" href="/app/event/new?{{ back_qs }}" hx-get="/app/event/new?{{ back_qs }}" hx-target="#modal-root" hx-swap="innerHTML">+ New event</a>

    <nav class="view-switch">
      {% for link in view_links %}
      <a class="{% if link.active %}active{% endif %}" href="{{ link.href }}" hx-get="{{ link.href }}" hx-target="#app-root" hx-push-url="true" hx-swap="outerHTML">{{ link.label }}</a>
      {% endfor %}
    </nav>

    <div class="sidebar-section">
      <h2>Calendars</h2>
      <ul class="calendar-list">
        {% for cal in calendars %}
        <li>
          <a class="cal-toggle {% if cal.visible %}visible{% endif %}" data-calendar-id="{{ cal.id }}" href="{{ cal.toggle_href }}" hx-get="{{ cal.toggle_href }}" hx-target="#app-root" hx-push-url="true" hx-swap="outerHTML" style="--cal-color: {{ cal.color }}">
            <span class="cal-dot"></span>
            <span class="cal-name">{{ cal.name }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>

    <div class="sidebar-footer">
      <span class="sidebar-user">{{ username }}</span>
      <form method="post" action="/logout"><button type="submit" class="btn-link">Sign out</button></form>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      {% if is_dated_view %}
      <div class="topbar-nav">
        <a class="btn btn-ghost" href="{{ today_href }}" hx-get="{{ today_href }}" hx-target="#app-root" hx-push-url="true" hx-swap="outerHTML">Today</a>
        <a class="btn btn-icon" href="{{ prev_href }}" hx-get="{{ prev_href }}" hx-target="#app-root" hx-push-url="true" hx-swap="outerHTML" aria-label="Previous">‹</a>
        <a class="btn btn-icon" href="{{ next_href }}" hx-get="{{ next_href }}" hx-target="#app-root" hx-push-url="true" hx-swap="outerHTML" aria-label="Next">›</a>
      </div>
      {% endif %}
      <h1 class="topbar-title">{{ title }}</h1>
      <button type="button" class="btn btn-icon theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">◐</button>
    </header>
    <div id="view" class="view-container">
      {{ body|safe }}
    </div>
  </main>
</div>
