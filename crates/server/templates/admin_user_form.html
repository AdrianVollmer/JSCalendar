<h1>{% if editing %}Edit user{% else %}New user{% endif %}</h1>
{% if let Some(err) = error %}
<p class="login-error" role="alert">{{ err }}</p>
{% endif %}
<form method="post" action="{% if editing %}/admin/users/{{ user_id }}/edit{% else %}/admin/users{% endif %}">
  <label class="field">
    <span>Username</span>
    <input type="text" name="username" value="{{ username }}" required autofocus autocapitalize="off" autocorrect="off">
  </label>
  <label class="field">
    <span>{% if editing %}New password <small>(leave blank to keep current)</small>{% else %}Password{% endif %}</span>
    <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" {% if !editing %}required{% endif %}>
  </label>
  <label class="field">
    <span>Role</span>
    <select name="role">
      <option value="user" {% if role == "user" %}selected{% endif %}>User</option>
      <option value="admin" {% if role == "admin" %}selected{% endif %}>Admin</option>
    </select>
  </label>

  <div class="settings-actions">
    <a class="btn btn-ghost" href="/admin/users">Cancel</a>
    <button type="submit" class="btn btn-primary">{% if editing %}Save{% else %}Create{% endif %}</button>
  </div>
</form>
