<div class="contacts-view">
  {% if contacts.is_empty() %}
  <p class="agenda-empty">No contacts found.</p>
  {% endif %}
  <ul class="contacts-list">
    {% for c in contacts %}
    <li class="contact-row">
      <span class="contact-avatar">{{ c.initial }}</span>
      <span class="contact-main">
        <span class="contact-name">{{ c.name }}</span>
        {% if let Some(email) = c.email %}<span class="contact-email">{{ email }}</span>{% endif %}
      </span>
      {% if let Some(bday) = c.birthday_label %}
      <span class="contact-birthday">🎂 {{ bday }}</span>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</div>
