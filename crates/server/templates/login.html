{% extends "base.html" %}
{% block title %}Sign in – JSCalendar{% endblock %}
{% block body %}
<main class="login-page">
  <form class="login-card" method="post" action="/login">
    <div class="login-brand">
      <img src="/static/icons/icon.svg" alt="" width="40" height="40">
      <h1>JSCalendar</h1>
    </div>
    <p class="login-sub">Sign in to your account</p>
    {% if let Some(err) = error %}
    <p class="login-error" role="alert">{{ err }}</p>
    {% endif %}
    <label>
      <span>Username</span>
      <input type="text" name="username" value="{{ username }}" required autofocus autocapitalize="off" autocorrect="off">
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" placeholder="••••••••" value="{{ password }}" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
</main>
{% endblock %}
