<h1>Password</h1>
{% if saved %}
<p class="settings-saved" role="status">Saved.</p>
{% endif %}
{% if let Some(err) = password_error %}
<p class="login-error" role="alert">{{ err }}</p>
{% endif %}
<p class="login-sub">Choose a new password for this account.</p>
<form method="post" action="/app/settings/password">
  <label class="field">
    <span>New password</span>
    <input type="password" name="new_password" placeholder="••••••••" autocomplete="new-password" required>
  </label>
  <label class="field">
    <span>Confirm new password</span>
    <input type="password" name="new_password_confirm" placeholder="••••••••" autocomplete="new-password" required>
  </label>

  <div class="settings-actions">
    <button type="submit" class="btn btn-primary">Update password</button>
  </div>
</form>
