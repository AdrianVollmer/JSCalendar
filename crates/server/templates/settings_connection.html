<h1>Calendar connection</h1>
{% if saved %}
<p class="settings-saved" role="status">Saved.</p>
{% endif %}
{% if let Some(err) = error %}
<p class="login-error" role="alert">Couldn't connect using the saved settings: {{ err }}</p>
{% endif %}
<p class="login-sub">The JMAP server this account's calendars, events, and contacts are stored on.</p>
<form method="post" action="/app/settings/connection">
  <label class="field">
    <span>Server</span>
    <input type="text" name="jmap_server_url" placeholder="mail.example.com" value="{{ jmap_server_url }}" autocapitalize="off" autocorrect="off">
  </label>
  <label class="field">
    <span>Username</span>
    <input type="text" name="jmap_username" placeholder="you@example.com" value="{{ jmap_username }}" autocapitalize="off" autocorrect="off">
  </label>
  <label class="field">
    <span>Password</span>
    <input type="password" name="jmap_password" placeholder="••••••••" value="{{ jmap_password }}" autocomplete="off">
  </label>
  <details class="login-advanced">
    <summary>Use an API token instead</summary>
    <label class="field">
      <span>Bearer token</span>
      <input type="text" name="jmap_token" placeholder="leave username/password empty" value="{{ jmap_token }}">
    </label>
  </details>

  <div class="settings-actions">
    <button type="button" class="btn btn-ghost conn-test-btn" hx-post="/app/settings/connection/test" hx-include="closest form" hx-target="#conn-test-result" hx-swap="innerHTML">
      <span class="btn-label">Test connection</span>
      <span class="btn-spinner" aria-hidden="true"></span>
    </button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
  <div id="conn-test-result" aria-live="polite"></div>
</form>
